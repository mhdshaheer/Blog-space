<div class="min-h-[80vh] flex-center p-4">
  <div class="max-w-2xl w-full text-center animate-fade-in">
    <!-- Background Glows -->
    <div class="absolute -z-10 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-primary/20 blur-[120px] rounded-full"></div>
    <div class="absolute -z-10 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-secondary/10 blur-[150px] rounded-full delay-700"></div>

    <div class="glass-card p-8 md:p-16 space-y-8 relative overflow-hidden">
      <!-- Decorative Element -->
      <div class="absolute top-0 right-0 p-8 opacity-10">
        <svg class="w-32 h-32" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
      </div>

      <div class="space-y-4">
        <h1 class="text-8xl md:text-9xl font-black text-brand-gradient tracking-tighter">404</h1>
        <h2 class="text-2xl md:text-4xl font-bold text-white">Lost in Space?</h2>
        <p class="text-slate-400 max-w-md mx-auto">
          The page you're looking for has vanished into the digital void. Don't worry, even the best explorers get lost sometimes.
        </p>
      </div>

      <div class="flex flex-col sm:flex-row gap-4 justify-center items-center pt-4">
        <a routerLink="/" class="btn btn-primary">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          Back to Home
        </a>
        <button (click)="goBack()" class="btn btn-ghost">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          Go Back
        </button>
      </div>
    </div>
  </div>
</div>
