<div class="min-h-[80vh] flex-center p-4">
  <div class="max-w-2xl w-full text-center animate-fade-in">
    <!-- Background Glows -->
    <div class="absolute -z-10 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-danger/20 blur-[120px] rounded-full"></div>
    <div class="absolute -z-10 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-warning/10 blur-[150px] rounded-full delay-700"></div>

    <div class="glass-card p-8 md:p-16 space-y-8 relative overflow-hidden">
      <!-- Decorative Element -->
      <div class="absolute top-0 right-0 p-8 opacity-10">
        <svg class="w-32 h-32" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
      </div>

      <div class="space-y-4">
        <h1 class="text-8xl md:text-9xl font-black text-brand-gradient tracking-tighter" style="background-image: linear-gradient(135deg, #ef4444 0%, #f59e0b 100%);">500</h1>
        <h2 class="text-2xl md:text-4xl font-bold text-white">Server Hiccup</h2>
        <p class="text-slate-400 max-w-md mx-auto">
          Something went wrong on our end. Our cosmic engineers are already on the case fixing the glitch.
        </p>
      </div>

      <div class="flex flex-col sm:flex-row gap-4 justify-center items-center pt-4">
        <button (click)="refresh()" class="btn btn-primary">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          Try Again
        </button>
        <a routerLink="/" class="btn btn-ghost">
          Return Home
        </a>
      </div>
    </div>
  </div>
</div>
